name: Snapshot - Eclipse LS Extensions

concurrency:
  group: sts5-snapshot-all
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    if: github.repository == 'spring-projects/spring-tools'
    branches:
      - 'main'
      - '4.x'

jobs:

  language-servers-multiplatform-build:
    if: github.repository == 'spring-projects/spring-tools'
    uses: ./.github/workflows/multiplatform-ls-build.yml
    with:
      java_version: '25'
      skip_tests: false
    secrets: inherit

  eclipse-ls-extensions:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ language-servers-multiplatform-build ]
    uses: ./.github/workflows/eclipse-ls-extensions-build.yml
    with:
      eclipse_profile: 'e441'
      build_type: 'snapshot'
      skip_tests: true
    secrets: inherit

#  e435-distro:
#    needs: [ eclipse-ls-extensions ]
#    uses: ./.github/workflows/gh-hosted-eclipse-distro-build.yml
#    with:
#      eclipse_profile: 'e435'
#      build_type: 'snapshot'
#      java_version: '25'
#    secrets: inherit
#

  e441-distro:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ eclipse-ls-extensions ]
    uses: ./.github/workflows/gh-hosted-eclipse-distro-build.yml
    with:
      eclipse_profile: 'e441'
      build_type: 'snapshot'
      java_version: '25'
    secrets: inherit

  e442-distro:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ eclipse-ls-extensions ]
    uses: ./.github/workflows/gh-hosted-eclipse-distro-build.yml
    with:
      eclipse_profile: 'e442'
      build_type: 'snapshot'
      java_version: '25'
    secrets: inherit

  vscode-spring-boot:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ language-servers-multiplatform-build ]
    uses: ./.github/workflows/snapshot-vscode-extension.yml
    with:
      extension-name: vscode-spring-boot
    secrets: inherit

  vscode-concourse:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ language-servers-multiplatform-build ]
    uses: ./.github/workflows/snapshot-vscode-extension.yml
    with:
      extension-name: vscode-concourse
    secrets: inherit

  vscode-manifest-yaml:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ language-servers-multiplatform-build ]
    uses: ./.github/workflows/snapshot-vscode-extension.yml
    with:
      extension-name: vscode-manifest-yaml
    secrets: inherit

  vscode-bosh:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ language-servers-multiplatform-build ]
    uses: ./.github/workflows/snapshot-vscode-extension.yml
    with:
      extension-name: vscode-bosh
    secrets: inherit

  standalone-ls:
    if: github.repository == 'spring-projects/spring-tools'
    needs: [ language-servers-multiplatform-build ]
    permissions:
      contents: write
    uses: ./.github/workflows/snapshot-standalone-ls.yml
    secrets: inherit
