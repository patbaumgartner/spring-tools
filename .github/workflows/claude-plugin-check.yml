name: Claude Plugin Check

# Keeps the Claude Code plugin under claude-plugins/spring-tools consistent with the
# language server: every diagnostic code has an explanation playbook, playbooks are
# well-formed, hooks and skills only reference MCP tools that exist, and the plugin
# manifest validates.

on:
  push:
    branches:
      - main
    paths:
      - 'claude-plugins/**'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/**/*ProblemType.java'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/validation/generations/AbstractDiagnosticValidator.java'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/yaml/reconcile/ApplicationYamlASTReconciler.java'
      - 'headless-services/commons/commons-yaml/src/main/java/org/springframework/ide/vscode/commons/yaml/reconcile/YamlSchemaProblems.java'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/mcp/**'
      - '.github/workflows/claude-plugin-check.yml'
  pull_request:
    paths:
      - 'claude-plugins/**'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/**/*ProblemType.java'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/validation/generations/AbstractDiagnosticValidator.java'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/yaml/reconcile/ApplicationYamlASTReconciler.java'
      - 'headless-services/commons/commons-yaml/src/main/java/org/springframework/ide/vscode/commons/yaml/reconcile/YamlSchemaProblems.java'
      - 'headless-services/spring-boot-language-server/src/main/java/org/springframework/ide/vscode/boot/mcp/**'
      - '.github/workflows/claude-plugin-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explanations-and-config:
    name: Explanation playbooks and plugin configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 22
      - name: Check explanation playbooks (coverage, structure, cross-references, coverage table)
        run: node claude-plugins/tools/check-explanations.mjs --require-all --todo
      - name: Run plugin tooling tests
        run: node --test --test-reporter=spec 'claude-plugins/tools/test/*.test.mjs'

  documentation-links:
    name: Documentation links resolve
    runs-on: ubuntu-latest
    # Only on the main branch: external link checks depend on docs.spring.io availability.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 22
      - name: Check that every documentation link in the playbooks returns HTTP 200
        run: node claude-plugins/tools/check-explanations.mjs --require-all --links

  plugin-manifest:
    name: Plugin manifest validates with the Claude Code CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 22
      - name: Install the Claude Code CLI into a temporary prefix
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code@latest
      - name: Validate the plugin manifest (no login required)
        run: |
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" --version
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" plugin validate ./claude-plugins/spring-tools --strict
